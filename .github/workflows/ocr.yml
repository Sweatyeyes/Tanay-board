# .github/workflows/ocr.yml
# Cron is only a backup now: on free Actions it actually fires once in a
# few hours. The reliable trigger is the push-driven twin of this job,
# scripts/ocr-data.yml, which the laptop keeps inside the data branch.

name: OCR board

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# cancel-in-progress is off: with pushes every minute a longer run would
# be cancelled forever. A shared group keeps one running plus the newest
# pending run; the rest are skipped.
concurrency:
  group: ocr
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  recognize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: code

      - name: Checkout image (data)
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - name: Checkout previous result (ocr, may not exist yet)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: ocr
          path: prev

      - name: Install Tesseract with Russian
        run: |
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-rus \
            || (sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-rus)

      - name: Install Python libraries
        run: pip install --quiet pillow numpy pytesseract

      - name: Recognize
        run: |
          mkdir -p out
          cp data/board.png out/source.png
          cp prev/history.json out/history.json 2>/dev/null || true
          python code/ocr/recognize.py data/board.png out/board.json out/debug.png out/history.json
          echo "--- board.json ---"
          cat out/board.json

      - name: Publish to ocr branch
        run: |
          cd out
          git init -q
          git config user.name "ocr-bot"
          git config user.email "ocr-bot@users.noreply.github.com"
          git checkout -q -b ocr
          git add -A
          git commit -q -m "ocr result"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ocr
