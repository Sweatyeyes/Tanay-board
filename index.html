<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Табло</title>
<meta name="theme-color" content="#0a0716">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="apple-touch-icon-precomposed" href="apple-touch-icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Танай">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
  // Тихий режим установки: манифест подключается только при заходе с меткой
  // .../index.html?app и в уже установленном приложении. Обычные посетители
  // ничего не замечают, браузер не предлагает установку.
  // Чтобы открыть установку для всех - убрать проверку APP_MODE ниже.
  (function () {
    var APP_MODE = /[?&]app\b/.test(location.search)
      || window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
    if (!APP_MODE) return;
    var l = document.createElement('link');
    l.rel = 'manifest';
    l.href = 'manifest.webmanifest';
    document.head.appendChild(l);
    window.__TANAY_APP = true;
  })();
</script>
<style>
  body { margin:0; background:#000; display:flex; flex-direction:column;
         justify-content:center; align-items:center; min-height:100vh;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  img.board { max-width:100%; max-height:92vh; }
  #offline { display:none; text-align:center; padding:20px; }
  #offline .msg { color:#ddd; font-size:6vw; }
  #offline img { max-width:90vw; max-height:70vh; border-radius:10px; }
  a.switch { color:#666; font-size:13px; text-decoration:none; padding:12px; }
</style>
</head>
<body>
<img id="board" class="board" src="" alt="Табло">
<div id="offline"></div>
<a class="switch" href="text.html">текстовая версия →</a>
<script>
  var IMAGE_URL  = "https://tanay-board.myshkevich.workers.dev/";
  var STATUS_URL = "https://raw.githubusercontent.com/Sweatyeyes/Tanay-board/data/last_update.txt";
  var MAX_AGE_MS = 10 * 60 * 1000;

  var OFFLINE_IMAGE = "";
  var OFFLINE_TEXT  = "Online-табло неактивно";

  var imgEl = document.getElementById('board');
  var offEl = document.getElementById('offline');

  offEl.innerHTML = OFFLINE_IMAGE
    ? '<img src="' + OFFLINE_IMAGE + '" alt="' + OFFLINE_TEXT + '">'
    : '<div class="msg">' + OFFLINE_TEXT + '</div>';

  function showBoard() {
    imgEl.src = IMAGE_URL + '?t=' + Date.now();
    imgEl.style.display = 'block';
    offEl.style.display = 'none';
  }
  function showOffline() {
    imgEl.style.display = 'none';
    offEl.style.display = 'block';
  }
  function tick() {
    fetch(STATUS_URL + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ return r.ok ? r.text() : Promise.reject(); })
      .then(function(text){
        var t = new Date(text.trim());
        if (!isNaN(t.getTime()) && (Date.now() - t.getTime()) > MAX_AGE_MS) showOffline();
        else showBoard();
      })
      .catch(function(){ showBoard(); });
  }
  tick();
  setInterval(tick, 20000);

  // воркер тоже только в режиме приложения - см. пояснение в шапке
  if (window.__TANAY_APP && 'serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
</script>
</body>
</html>
