<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Табло</title>
<meta name="theme-color" content="#0a0716">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-v3.png">
<link rel="apple-touch-icon-precomposed" href="apple-touch-icon-v3.png">
<link rel="apple-touch-icon" href="apple-touch-icon-v3.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192-v3.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Танай">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
  // Тихий режим установки: манифест подключается только при заходе с меткой
  // .../index.html?app и в уже установленном приложении. Обычные посетители
  // ничего не замечают, браузер не предлагает установку.
  // Чтобы открыть установку для всех - убрать проверку APP_MODE ниже.
  (function () {
    var APP_MODE = /[?&]app\b/.test(location.search)
      || window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
    if (!APP_MODE) return;
    var l = document.createElement('link');
    l.rel = 'manifest';
    l.href = 'manifest.webmanifest';
    document.head.appendChild(l);
    window.__TANAY_APP = true;
  })();
</script>
<style>
  body { margin:0; background:#000; display:flex; flex-direction:column;
         justify-content:center; align-items:center; min-height:100vh;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  img.board { max-width:100%; max-height:92vh; }
  #offline { display:none; text-align:center; padding:20px; }
  #offline .msg { color:#ddd; font-size:6vw; }
  #offline img { max-width:90vw; max-height:70vh; border-radius:10px; }
  /* Кнопка, а не ссылка со стрелкой: со стрелкой не всем очевидно,
     что на неё можно нажать. */
  a.switch { display:inline-flex; align-items:center; gap:9px;
             margin:16px 16px 6px; padding:13px 22px; text-decoration:none;
             font-size:15px; font-weight:600; color:#fff;
             background:#E8511A; border-radius:10px;
             box-shadow:0 2px 10px rgba(232,81,26,.35);
             -webkit-tap-highlight-color:transparent; }
  a.switch:active { background:#c2440f; }
  a.switch svg { flex:none; }
  a.switch small { display:block; font-size:11.5px; font-weight:400;
                   opacity:.85; margin-top:2px; }
  .how { color:#5c5c5c; font-size:11.5px; line-height:1.7; text-align:center;
         max-width:420px; padding:0 16px 18px; }
  .how b { color:#7a7a7a; font-weight:600; }
</style>
</head>
<body>
<img id="board" class="board" src="" alt="Табло">
<div id="offline"></div>
<!-- метка ?app включает манифест: без неё Chrome на Android не предложит установку -->
<a class="switch" href="text.html?app">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="6" y="2" width="12" height="20" rx="2.5"/>
    <line x1="11" y1="18.5" x2="13" y2="18.5"/>
  </svg>
  <span>Открыть приложение<small>ещё в работе, можно поставить на телефон</small></span>
</a>
<div class="how">
  <b>iPhone:</b> открыть ссылку в Safari, нажать «Поделиться» и выбрать
  «На экран „Домой"».<br>
  <b>Android:</b> открыть в Chrome, меню из трёх точек — «Установить приложение».
</div>
<div id="support"></div>
<script>
  var IMAGE_URL  = "https://tanay-board.myshkevich.workers.dev/";
  var STATUS_URL = "https://raw.githubusercontent.com/Sweatyeyes/Tanay-board/data/last_update.txt";
  var MAX_AGE_MS = 10 * 60 * 1000;

  var OFFLINE_IMAGE = "";
  var OFFLINE_TEXT  = "Online-табло неактивно";

  var imgEl = document.getElementById('board');
  var offEl = document.getElementById('offline');

  offEl.innerHTML = OFFLINE_IMAGE
    ? '<img src="' + OFFLINE_IMAGE + '" alt="' + OFFLINE_TEXT + '">'
    : '<div class="msg">' + OFFLINE_TEXT + '</div>';

  function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;
  }

  function showBoard() {
    // метка ?app - только для счётчика посещений на воркере
    imgEl.src = IMAGE_URL + '?t=' + Date.now() + (isStandalone() ? '&app=1' : '');
    imgEl.style.display = 'block';
    offEl.style.display = 'none';
  }
  function showOffline() {
    imgEl.style.display = 'none';
    offEl.style.display = 'block';
  }
  function tick() {
    fetch(STATUS_URL + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ return r.ok ? r.text() : Promise.reject(); })
      .then(function(text){
        var t = new Date(text.trim());
        if (!isNaN(t.getTime()) && (Date.now() - t.getTime()) > MAX_AGE_MS) showOffline();
        else showBoard();
      })
      .catch(function(){ showBoard(); });
  }
  // в фоне не опрашиваем: экономим и батарею, и лимиты воркера
  tick();
  setInterval(function () { if (!document.hidden) tick(); }, 20000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) tick();
  });

  // воркер тоже только в режиме приложения - см. пояснение в шапке
  if (window.__TANAY_APP && 'serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
</script>
<script src="support.js"></script>
</body>
</html>
