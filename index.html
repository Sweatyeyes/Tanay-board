<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Табло</title>
<style>
  body { margin:0; background:#000; display:flex; justify-content:center; align-items:center; height:100vh; }
  img { max-width:100%; max-height:100%; }
</style>
</head>
<body>
<img id="board" src="" alt="Табло" style="display:none;">
<div id="offline" style="display:none; color:#ccc; font-family:sans-serif; font-size:5vw; text-align:center; padding:20px;">
  Табло временно недоступно
</div>
<script>
  const IMAGE_URL  = "https://tanay-board.myshkevich.workers.dev/";
  const STATUS_URL = "https://raw.githubusercontent.com/Sweatyeyes/Tanay-board/main/last_update.txt";
  const MAX_AGE_MS = 10 * 60 * 1000;

  const imgEl = document.getElementById('board');
  const offlineEl = document.getElementById('offline');

  function showBoard() {
    imgEl.src = IMAGE_URL + '?t=' + Date.now();
    imgEl.style.display = 'block';
    offlineEl.style.display = 'none';
  }
  function showOffline() {
    imgEl.style.display = 'none';
    offlineEl.style.display = 'block';
  }

  function tick() {
    fetch(STATUS_URL + '?t=' + Date.now(), { cache: 'no-store' })
      .then(r => r.ok ? r.text() : Promise.reject())
      .then(text => {
        const lastUpdate = new Date(text.trim());
        const ageMs = Date.now() - lastUpdate.getTime();
        if (!isNaN(lastUpdate.getTime()) && ageMs > MAX_AGE_MS) {
          showOffline();
        } else {
          showBoard();
        }
      })
      .catch(() => { showBoard(); });
  }

  tick();
  setInterval(tick, 20000);
</script>
</body>
</html>
