<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKYDIVE TANAY — онлайн-табло</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Russo+One&display=swap" rel="stylesheet">
<style>
  :root {
    --line:rgba(255,255,255,.16); --line2:rgba(255,255,255,.12);
    --card:rgba(10,7,20,.38); --text:#fdf6ef; --mut:rgba(255,255,255,.55);
    --orange:#E8511A; --orange2:#ff7a4d; --gold:#FFC94D; --blue:#bcd4ff;
    --green:#c9f08a;
  }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--text); padding:14px 12px 4px; background:#0a0716;
         font-family:'Manrope',-apple-system,"Segoe UI",Roboto,sans-serif; }
  /* закат приколочен к экрану: списки скроллятся, солнце остаётся у горизонта */
  body::before { content:''; position:fixed; inset:0; z-index:-1;
    background-image:
      radial-gradient(1px 1px at 12% 6%, rgba(255,255,255,.7) 50%, transparent 51%),
      radial-gradient(1px 1px at 33% 3%, rgba(255,255,255,.5) 50%, transparent 51%),
      radial-gradient(1px 1px at 58% 9%, rgba(255,255,255,.6) 50%, transparent 51%),
      radial-gradient(1px 1px at 76% 4%, rgba(255,255,255,.4) 50%, transparent 51%),
      radial-gradient(2px 2px at 89% 11%, rgba(255,255,255,.5) 50%, transparent 51%),
      radial-gradient(1px 1px at 21% 14%, rgba(255,255,255,.45) 50%, transparent 51%),
      radial-gradient(1px 1px at 45% 18%, rgba(255,255,255,.35) 50%, transparent 51%),
      linear-gradient(180deg,#0a0716 0%,#1b1433 34%,#3a1a3f 62%,#7a2b2a 86%,#c2511f 100%);
  }

  .brand { display:flex; align-items:flex-end; justify-content:space-between; gap:12px;
           margin-bottom:16px; }
  .brand img { height:58px; display:block; }
  .brand .word { font-family:'Russo One',sans-serif; font-size:20px; letter-spacing:.06em; }
  .clock { font-family:'Russo One',sans-serif; font-size:24px; letter-spacing:.05em;
           text-align:right; line-height:1; }
  .clock small { display:block; font-family:'Manrope',sans-serif; font-weight:600;
                 font-size:11px; color:var(--mut); letter-spacing:.2em;
                 text-transform:uppercase; margin-bottom:5px; }

  .bar-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .until { font-family:'Russo One',sans-serif; font-size:12px; letter-spacing:.08em;
           color:var(--gold); border:1px solid rgba(255,201,77,.4);
           background:rgba(20,12,8,.35); padding:7px 12px; }
  .toggle-all { background:rgba(10,7,20,.3); color:var(--mut); border:1px solid var(--line);
                padding:7px 14px; font-size:12px; font-weight:800; font-family:inherit;
                letter-spacing:.06em; text-transform:uppercase; cursor:pointer; }
  .toggle-all:active { background:rgba(255,255,255,.08); }

  .msg { background:rgba(120,20,10,.4); color:#ffb3a6; border:1px solid rgba(255,122,77,.5);
         border-left:4px solid var(--orange); padding:12px 14px; margin-bottom:12px;
         font-size:16px; font-weight:800; }
  .stale { background:rgba(60,40,8,.4); color:var(--gold); border:1px solid rgba(255,201,77,.35);
           border-left:4px solid var(--gold); padding:11px 14px; margin-bottom:12px; font-size:14px; }

  .load { background:var(--card); border:1px solid var(--line2); border-left:4px solid var(--gold);
          margin-bottom:12px; overflow:hidden; backdrop-filter:blur(10px);
          -webkit-backdrop-filter:blur(10px); }
  .load h2 { margin:0; padding:12px 13px 10px; font-family:'Russo One',sans-serif;
             font-weight:400; font-size:15px; letter-spacing:.03em; color:var(--text);
             display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none;
             -webkit-tap-highlight-color:transparent; }
  .load h2 .chev { color:var(--mut); font-size:10px; transition:transform .18s; flex:none;
                   transform:rotate(90deg); }
  .load.closed h2 .chev { transform:rotate(0deg); }
  .load h2 .t { flex:1; line-height:1.4; }
  .t .ready { color:var(--gold); }
  .t .sent { color:var(--orange2); }
  .count { font-family:'Manrope',sans-serif; font-size:11px; color:var(--mut); font-weight:800;
           flex:none; border:1px solid var(--line2); padding:4px 9px; letter-spacing:.05em; }
  .fill { height:3px; background:rgba(255,255,255,.12); }
  .fill i { display:block; height:100%; background:var(--orange); transition:width .4s; }
  .load.full .fill i { background:var(--gold); }

  .body { padding:2px 13px 12px; }
  .load.closed .body, .load.closed .fill { display:none; }
  .row { display:flex; gap:10px; padding:7px 0; border-bottom:1px solid rgba(255,255,255,.1);
         font-size:17px; align-items:baseline; }
  .row:last-child { border-bottom:none; }
  .num { color:rgba(255,255,255,.4); width:26px; flex:none; font-size:12px; font-weight:800; }
  .name { flex:1; font-weight:600; }
  .staff .name { color:var(--gold); font-weight:800; }
  .service .name, .service .cat { color:rgba(255,255,255,.42); font-weight:400; }
  .cat { color:var(--blue); flex:none; font-size:13px; font-weight:600; }
  .freechip { display:inline-block; margin-top:9px; color:var(--green); font-size:12px;
              font-weight:800; letter-spacing:.04em; border:1px solid rgba(201,240,138,.4);
              background:rgba(20,25,8,.3); padding:5px 11px; }

  .note { color:var(--mut); font-size:15px; line-height:1.6; padding:20px 4px; }
  a.switch { display:block; text-align:center; color:rgba(255,255,255,.45); font-size:13px;
             text-decoration:none; padding:16px; }
  a.switch:hover { color:var(--text); }
  .foot { text-align:center; color:rgba(255,255,255,.35); font-family:'Russo One',sans-serif;
          font-size:10px; letter-spacing:.3em; text-transform:uppercase; padding-bottom:14px; }
</style>
</head>
<body>
<div class="brand">
  <img src="logo.png" alt="Skydive Tanay"
       onerror="this.outerHTML='&lt;div class=&quot;word&quot;&gt;SKYDIVE TANAY&lt;/div&gt;'">
  <div class="clock" id="clock"><small>борт-время</small>—</div>
</div>
<div id="app"><div class="note">Загрузка…</div></div>
<a class="switch" href="index.html">← версия с картинкой</a>
<div class="foot">Skydive Tanay · Drop Zone Board</div>
<script>
  var JSON_URL   = "https://raw.githubusercontent.com/Sweatyeyes/Tanay-board/ocr/board.json";
  var MAX_AGE_MS = 10 * 60 * 1000;
  var app = document.getElementById('app');
  var clockEl = document.getElementById('clock');

  // какие взлёты свёрнуты - переживает и перерисовку, и перезагрузку страницы
  var collapsed = {};
  try { collapsed = JSON.parse(localStorage.getItem('tanay_collapsed') || '{}'); } catch (e) {}
  function saveCollapsed() {
    try { localStorage.setItem('tanay_collapsed', JSON.stringify(collapsed)); } catch (e) {}
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }

  function isService(r) {
    var n = String(r.name || '');
    return n.indexOf('КВОРУМ') === 0 || n === '(Вып.)';
  }

  function fmtTitle(t) {
    var s = esc(t).replace(/(^|\s)готов(?=\s|$)/, '$1готовность');
    s = s.replace(/(ОТПРАВЛЕН!*)/, '<span class="sent">$1</span>');
    s = s.replace(/(готовность[^<]*)/, '<span class="ready">$1</span>');
    return s;
  }

  function render(d) {
    clockEl.innerHTML = '<small>борт-время</small>' + esc(d.clock || '—');

    var html = '';
    var loads = d.loads || [];
    html += '<div class="bar-top">';
    html += d.work_until ? '<span class="until">' + esc(d.work_until) + '</span>' : '<span></span>';
    if (loads.length) {
      var allClosed = loads.every(function(_, i){ return collapsed[i]; });
      html += '<button class="toggle-all" id="toggleAll">'
           + (allClosed ? 'Развернуть все' : 'Свернуть все') + '</button>';
    }
    html += '</div>';

    if (d.status === 'no_board') {
      html += '<div class="stale">Табло сейчас не транслируется — на экране заставка подключения. Обычно это ненадолго.</div>';
    }
    if (d.updated) {
      var age = Date.now() - new Date(d.updated).getTime();
      if (age > MAX_AGE_MS) html += '<div class="stale">Данные не обновлялись более 10 минут</div>';
    }
    if (d.message) html += '<div class="msg">' + esc(d.message) + '</div>';

    if (!loads.length && d.status !== 'no_board') html += '<div class="note">Пока никого не записано.</div>';

    for (var i = 0; i < loads.length; i++) {
      var L = loads[i], rows = L.rows || [];
      var seats = L.free_from ? (L.free_from - 1) : rows.length;
      var denom = Math.max(seats, 18);
      var pct = Math.min(100, Math.round(rows.length / denom * 100));
      var closed = collapsed[i] ? ' closed' : '';
      var full = (!L.free_from && rows.length) ? ' full' : '';
      html += '<div class="load' + closed + full + '" data-i="' + i + '">';
      html += '<h2><span class="chev">▶</span><span class="t">' + fmtTitle(L.title || ('взлёт ' + (i+1))) + '</span>';
      html += '<span class="count">' + rows.length + (L.capacity ? ' / ' + L.capacity : '') + '</span></h2>';
      html += '<div class="fill"><i style="width:' + pct + '%"></i></div>';
      html += '<div class="body">';
      for (var j = 0; j < rows.length; j++) {
        var r = rows[j];
        var cls = 'row' + (r.staff ? ' staff' : '') + (isService(r) ? ' service' : '');
        html += '<div class="' + cls + '"><span class="num">' + esc(r.n) + '</span>'
             +  '<span class="name">' + esc(r.name) + '</span>'
             +  '<span class="cat">' + esc(r.cat) + '</span></div>';
      }
      if (L.free_from) {
        html += '<span class="freechip">свободно с ' + esc(L.free_from) + '-го места</span>';
      }
      html += '</div></div>';
    }
    app.innerHTML = html;
  }

  // один обработчик на контейнер - переживает перерисовки
  app.addEventListener('click', function(e) {
    var btn = e.target.closest ? e.target.closest('#toggleAll') : null;
    if (btn) {
      var blocks = app.querySelectorAll('.load');
      var allClosed = true;
      blocks.forEach(function(b){ if (!b.classList.contains('closed')) allClosed = false; });
      blocks.forEach(function(b){
        var i = b.getAttribute('data-i');
        if (allClosed) { b.classList.remove('closed'); delete collapsed[i]; }
        else { b.classList.add('closed'); collapsed[i] = 1; }
      });
      btn.textContent = allClosed ? 'Свернуть все' : 'Развернуть все';
      saveCollapsed();
      return;
    }
    var h = e.target.closest ? e.target.closest('.load h2') : null;
    if (h) {
      var block = h.parentNode;
      var i = block.getAttribute('data-i');
      if (block.classList.toggle('closed')) collapsed[i] = 1;
      else delete collapsed[i];
      saveCollapsed();
    }
  });

  function tick() {
    fetch(JSON_URL + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
      .then(render)
      .catch(function(){
        app.innerHTML = '<div class="note">Текстовая версия ещё готовится — распознавание пока не запущено.<br><br>'
                      + 'Рабочее табло доступно по ссылке ниже.</div>';
      });
  }

  tick();
  setInterval(tick, 20000);
</script>
</body>
</html>
