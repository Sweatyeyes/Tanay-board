<script>
  // Тихий режим установки: манифест подключается только при заходе с меткой
  // .../text.html?app и в уже установленном приложении. Обычные посетители
  // ничего не замечают, браузер не предлагает установку.
  // Чтобы открыть установку для всех - убрать проверку APP_MODE ниже.
  (function () {
    var APP_MODE = /[?&]app\b/.test(location.search)
      || window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
    if (!APP_MODE) return;
    var l = document.createElement('link');
    l.rel = 'manifest';
    l.href = 'manifest.webmanifest';
    document.head.appendChild(l);
    window.__TANAY_APP = true;
  })();
</script>

<style>
  :root {
    --line:rgba(255,255,255,.16); --line2:rgba(255,255,255,.12);
    --card:rgba(10,7,20,.38); --text:#fdf6ef; --mut:rgba(255,255,255,.55);
    --orange:#E8511A; --orange2:#ff7a4d; --gold:#FFC94D; --blue:#bcd4ff;
    --green:#c9f08a; --me:#5CF08A;
  }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--text); padding:14px 12px 4px; background:#0a0716;
         font-family:'Manrope',-apple-system,"Segoe UI",Roboto,sans-serif; }
  /* закат приколочен к экрану: списки скроллятся, солнце остаётся у горизонта */
  body::before { content:''; position:fixed; inset:0; z-index:-1;
    background-image:
      radial-gradient(1px 1px at 12% 6%, rgba(255,255,255,.7) 50%, transparent 51%),
      radial-gradient(1px 1px at 33% 3%, rgba(255,255,255,.5) 50%, transparent 51%),
      radial-gradient(1px 1px at 58% 9%, rgba(255,255,255,.6) 50%, transparent 51%),
      radial-gradient(1px 1px at 76% 4%, rgba(255,255,255,.4) 50%, transparent 51%),
      radial-gradient(2px 2px at 89% 11%, rgba(255,255,255,.5) 50%, transparent 51%),
      radial-gradient(1px 1px at 21% 14%, rgba(255,255,255,.45) 50%, transparent 51%),
      radial-gradient(1px 1px at 45% 18%, rgba(255,255,255,.35) 50%, transparent 51%),
      linear-gradient(180deg,#0a0716 0%,#1b1433 34%,#3a1a3f 62%,#7a2b2a 86%,#c2511f 100%);
  }

  .brand { display:flex; align-items:flex-end; justify-content:space-between; gap:10px;

  .brand img { height:58px; display:block; }
  .brand .word { font-family:'Russo One',sans-serif; font-size:20px; letter-spacing:.06em; }
  /* дата со временем подогнаны по ширине под надпись "борт-время" */
  .clock { font-family:'Russo One',sans-serif; font-size:15px; letter-spacing:.02em;

  .clock small { display:block; font-family:'Manrope',sans-serif; font-weight:600;

  .gear { background:rgba(10,7,20,.3); border:1px solid var(--line); color:var(--text);

  .bar-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }

  /* ---- настройки ---- */
  .settings { display:none; background:rgba(10,7,20,.55); border:1px solid var(--line);
              border-left:4px solid var(--me); padding:14px; margin-bottom:12px;

  .settings.open { display:block; }

  .addrow { display:flex; gap:8px; margin-bottom:10px; }

                   color:var(--me); font-family:inherit; font-weight:800; font-size:13px;

  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }

  .load { background:var(--card); border:1px solid var(--line2); border-left:4px solid var(--gold);

  .load.mine { border-left-color:var(--me); }
  /* шапка взлёта - тёплая закатная полоса, чтобы отделяться от списка */
  .load h2 { margin:0; padding:12px 13px 10px; font-family:'Russo One',sans-serif;
             font-weight:400; font-size:15px; letter-spacing:.03em; color:#fff4e8;
             background:linear-gradient(180deg,rgba(232,81,26,.42) 0%,rgba(150,40,30,.34) 100%);
             border-bottom:1px solid rgba(255,201,77,.28);
             display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none;
             -webkit-tap-highlight-color:transparent; }
  .load h2 .t { flex:1; line-height:1.4; }
  /* готовность - отдельной строкой под названием взлёта */
  .t .ready { display:block; color:var(--gold); font-size:13px; margin-top:3px;
              letter-spacing:.02em; }
  .t .sent { color:var(--orange2); }
  .count { font-family:'Manrope',sans-serif; font-size:11px; color:rgba(255,255,255,.8);
           font-weight:800; flex:none; border:1px solid rgba(255,255,255,.28);
           background:rgba(10,7,20,.3); padding:4px 9px; letter-spacing:.05em; }
  .fill { height:3px; background:rgba(255,255,255,.12); }
  .fill i { display:block; height:100%; background:var(--orange); transition:width .4s; }
  .load.full .fill i { background:var(--gold); }

  .body { padding:2px 13px 12px; background:rgba(6,4,14,.34); }
  .load.closed .body, .load.closed .fill { display:none; }
  .row { display:flex; gap:10px; padding:7px 0; border-bottom:1px solid rgba(255,255,255,.1);
         font-size:17px; align-items:baseline; }
  .row:last-child { border-bottom:none; }
  .num { color:rgba(255,255,255,.4); width:26px; flex:none; font-size:12px; font-weight:800; }
  .name { flex:1; font-weight:600; }
  .staff .name { color:var(--gold); font-weight:800; }
  .service .name, .service .cat { color:rgba(255,255,255,.42); font-weight:400; }
  .cat { color:var(--blue); flex:none; font-size:13px; font-weight:600; }
  /* своя фамилия из настроек - зелёным, поверх стаффа */
  .row.me { background:rgba(92,240,138,.13); margin:0 -13px; padding-left:13px;
            padding-right:13px; border-left:3px solid var(--me); }
  .row.me .name, .row.staff.me .name { color:var(--me); font-weight:800; }
  .freechip { display:inline-block; margin-top:9px; color:var(--green); font-size:12px;

  .note { color:var(--mut); font-size:15px; line-height:1.6; padding:20px 4px; }
  a.switch { display:block; text-align:center; color:rgba(255,255,255,.45); font-size:13px;

          font-size:10px; letter-spacing:.3em; text-transform:uppercase; padding-bottom:14px; }
</style>

<body>
<div class="brand">
  <img src="logo.png" alt="Skydive Tanay"
       onerror="this.outerHTML='&lt;div class=&quot;word&quot;&gt;SKYDIVE TANAY&lt;/div&gt;'">

</div>

<div class="bar-top">
  <span id="until"></span>
  <button class="gear" id="gear" aria-label="Настройки">&#9881;</button>
</div>

<div class="settings" id="settings">
  <h3>Слежу за фамилиями</h3>
  <p>Строка с этой фамилией подсветится зелёным, и придёт уведомление, когда человек появится во взлёте.</p>
  <div class="addrow">
    <input id="watchInput" type="text" placeholder="Мышкевич" autocomplete="off"
           autocapitalize="words" spellcheck="false">
    <button id="watchAdd">Добавить</button>
  </div>
  <div class="chips" id="watchChips"></div>
  <label class="opt"><input type="checkbox" id="optNotify">
    <span>Уведомления<small id="notifyState">о чём предупреждать — выберите ниже</small></span></label>
  <div class="events" id="events">
    <label><input type="checkbox" data-ev="in"> запись во взлёт</label>
    <label><input type="checkbox" data-ev="15"> готовность 15 минут</label>
    <label><input type="checkbox" data-ev="10"> готовность 10 минут</label>
    <label><input type="checkbox" data-ev="5"> готовность 5 минут</label>
  </div>
  <div class="warn" id="notifyWarn"></div>
  <div class="diag" id="notifyDiag"></div>
  <button class="testbtn" id="notifyTest">Проверить уведомление</button>

<div id="app"><div class="note">Загрузка…</div></div>
<a class="switch" href="index.html">← показать экран</a>
<div class="foot">Skydive Tanay · Drop Zone Board</div>
<script>
  // через Worker, а не raw.githubusercontent: тот кэширует ответ на ~5 минут
  var JSON_URL   = "https://tanay-board.myshkevich.workers.dev/board.json";
  var JSON_FALLBACK = "https://raw.githubusercontent.com/Sweatyeyes/Tanay-board/ocr/board.json";
  var MAX_AGE_MS = 10 * 60 * 1000;
  var POLL_MS    = 10000;
  var app = document.getElementById('app');
  var clockEl = document.getElementById('clock');
  var untilEl = document.getElementById('until');

  // ---------- хранилище ----------
  function load(key, def) {
    try { var v = JSON.parse(localStorage.getItem(key)); return v == null ? def : v; }
    catch (e) { return def; }
  }
  function save(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }

  var collapsed = load('tanay_collapsed', {});
  var watch     = load('tanay_watch', []);          // фамилии, за которыми следим
  var notifyOn  = load('tanay_notify', false);
  // о чём предупреждать: запись во взлёт и пороги готовности в минутах
  var events    = load('tanay_events', { in: true, "15": true, "10": false, "5": true });
  var sent      = load('tanay_sent', {});           // что уже отправляли, чтобы не повторяться

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }

  function plural(n, one, few, many) {
    var n10 = n % 10, n100 = n % 100;
    if (n10 === 1 && n100 !== 11) return one;
    if (n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14)) return few;
    return many;
  }

  function isService(r) {
    var n = String(r.name || '');
    return n.indexOf('КВОРУМ') === 0 || n === '(Вып.)';
  }

  // ---------- сверка фамилий с допуском на ошибки распознавания ----------
  function norm(s) {
    return String(s || '').toLowerCase().replace(/ё/g, 'е').replace(/[^a-zа-я]/g, '');
  }
  function dist(a, b) {                       // расстояние Левенштейна
    var m = a.length, n = b.length, prev = [], cur = [], i, j;
    for (j = 0; j <= n; j++) prev[j] = j;
    for (i = 1; i <= m; i++) {
      cur[0] = i;
      for (j = 1; j <= n; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1,
                          prev[j - 1] + (a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1));
      }
      for (j = 0; j <= n; j++) prev[j] = cur[j];
    }
    return prev[n];
  }
  // одна-две перепутанные буквы - всё ещё тот же человек
  function looksSame(a, b) {
    a = norm(a); b = norm(b);
    if (!a || !b) return false;
    if (a === b) return true;
    if (Math.abs(a.length - b.length) > 2) return false;
    var allow = a.length <= 5 ? 1 : 2;
    return dist(a, b) <= allow;
  }
  // возвращает фамилию из настроек (она постоянна), а не распознанную:
  // иначе "Мышкевич" и "Мышквич" в разных прогонах дадут разные ключи
  // уведомлений, и одно и то же придёт дважды
  function matchedWatch(rowName) {
    var surname = String(rowName || '').split(' ')[0];
    for (var i = 0; i < watch.length; i++) {
      if (looksSame(surname, watch[i])) return watch[i];
    }
    return null;
  }
  function isWatched(rowName) { return matchedWatch(rowName) != null; }

  // ---------- уведомления ----------
  var swReg = null;
  function notifySupported() { return 'Notification' in window; }

  // Сервис-воркер нужен для показа уведомлений: на iPhone это вообще
  // единственный работающий способ, а он есть не сразу - регистрацию
  // приходится дожидаться.
  function ensureSw() {
    if (swReg) return Promise.resolve(swReg);
    if (!('serviceWorker' in navigator)) return Promise.resolve(null);
    return navigator.serviceWorker.register('sw.js')
      .then(function () { return navigator.serviceWorker.ready; })
      .then(function (reg) { swReg = reg; return reg; })
      .catch(function () { return null; });
  }

  function showNote(title, body, tag) {
    var opts = { body: body, tag: tag, icon: 'icon-192.png', badge: 'icon-192.png',
                 renotify: true, vibrate: [120, 60, 120] };
    return ensureSw().then(function (reg) {
      if (reg && reg.showNotification) return reg.showNotification(title, opts);
      try { new Notification(title, opts); } catch (e) {
        lastNoteError = String(e && e.message || e);
        renderNotifyState();
      }
    }).catch(function (e) {
      lastNoteError = String(e && e.message || e);
      renderNotifyState();
    });
  }
  var lastNoteError = '';

  function loadNumber(title) {
    var m = String(title || '').match(/(\d+)\s*взл/i);
    return m ? m[1] : '';
  }
  function readyMinutes(title) {
    var m = String(title || '').match(/готов\S*\s+(\d+)\s*мин/i);
    return m ? parseInt(m[1], 10) : null;
  }

  // ключи отправленного чистим, когда взлёт пропал с табло
  function pruneSent(validKeys) {
    var out = {};
    for (var k in sent) if (validKeys[k]) out[k] = sent[k];
    sent = out;
    save('tanay_sent', sent);
  }

  function checkNotifications(d) {
    if (!notifyOn || !watch.length || !notifySupported()) return;
    if (Notification.permission !== 'granted') return;

    var loads = d.loads || [], valid = {}, fresh = [];
    for (var i = 0; i < loads.length; i++) {
      var L = loads[i], rows = L.rows || [], num = loadNumber(L.title) || (i + 1);
      var mine = null, who = null;
      for (var j = 0; j < rows.length; j++) {
        var hit = isService(rows[j]) ? null : matchedWatch(rows[j].name);
        if (hit) { mine = rows[j]; who = hit; break; }
      }
      if (!mine) continue;

      var base = num + '|' + norm(who);
      // пока взлёт на табло, все его отметки считаем живыми - иначе чистка
      // забудет, что мы уже предупреждали, и уведомление придёт повторно
      valid[base + '|in'] = 1;
      valid[base + '|15'] = 1;
      valid[base + '|10'] = 1;
      valid[base + '|5'] = 1;

      var list = [];
      if (events["in"]) {
        list.push({ key: base + '|in',
                    title: 'Вы записаны во взлёт ' + num,
                    body: mine.name + (mine.cat ? ' · ' + mine.cat : '') });
      }

      // пороги готовности. Срабатывает тот, в чей промежуток попал отсчёт,
      // и только если он отмечен галочкой. Каждый порог - один раз на взлёт,
      // но если готовность отодвинули (было 15, стало 25), порог взводится
      // заново: это уже другая готовность, и предупредить нужно снова.
      var mins = readyMinutes(L.title);
      var steps = [15, 10, 5];
      for (var s = 0; s < steps.length; s++) {
        var limit = steps[s];
        var lower = (s + 1 < steps.length) ? steps[s + 1] : -1;   // нижняя граница
        // запас в 3 минуты - чтобы дрожание распознавания не взводило порог
        if (mins != null && mins >= limit + 3 && sent[base + '|' + limit]) {
          delete sent[base + '|' + limit];
          save('tanay_sent', sent);
        }
        if (!events[String(limit)] || mins == null) continue;
        if (mins <= limit && mins > lower) {
          list.push({ key: base + '|' + limit,
                      title: 'Взлёт ' + num + ' — готовность ' + limit + ' минут',
                      body: limit <= 5 ? 'На посадку' : 'Пора собираться' });
        }
      }
      if (/ОТПРАВЛЕН/i.test(L.title || '')) valid[base + '|in'] = 1;

      for (var e = 0; e < list.length; e++) {
        valid[list[e].key] = 1;
        if (!sent[list[e].key]) fresh.push(list[e]);
      }
    }

    pruneSent(valid);
    for (var f = 0; f < fresh.length; f++) {
      showNote(fresh[f].title, fresh[f].body, fresh[f].key);
      sent[fresh[f].key] = Date.now();
    }
    if (fresh.length) save('tanay_sent', sent);
  }

  // ---------- отрисовка настроек ----------
  var gear = document.getElementById('gear');
  var settings = document.getElementById('settings');
  var chipsEl = document.getElementById('watchChips');
  var inputEl = document.getElementById('watchInput');
  var optNotify = document.getElementById('optNotify');
  var notifyWarn = document.getElementById('notifyWarn');
  var notifyDiag = document.getElementById('notifyDiag');
  var notifyTest = document.getElementById('notifyTest');
  var eventsBox = document.getElementById('events');

  function renderEvents() {
    var boxes = eventsBox.querySelectorAll('input[data-ev]');
    for (var i = 0; i < boxes.length; i++) {
      boxes[i].checked = !!events[boxes[i].getAttribute('data-ev')];
    }
    eventsBox.className = optNotify.checked ? 'events' : 'events off';
  }

  eventsBox.addEventListener('change', function (e) {
    var ev = e.target.getAttribute && e.target.getAttribute('data-ev');
    if (!ev) return;
    events[ev] = e.target.checked;
    save('tanay_events', events);
    renderNotifyState();
  });

  function renderChips() {
    var html = '';
    for (var i = 0; i < watch.length; i++) {
      html += '<span class="chip"><b>' + esc(watch[i]) + '</b>'
           +  '<span data-del="' + i + '" role="button" aria-label="Убрать">&times;</span></span>';
    }
    chipsEl.innerHTML = html || '<span style="color:rgba(255,255,255,.45);font-size:13px;">'
                              + 'Пока никого — добавьте фамилию выше.</span>';
    gear.className = watch.length ? 'gear on' : 'gear';
  }

  function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;
  }

  function renderNotifyState() {
    optNotify.checked = notifyOn && notifySupported() && Notification.permission === 'granted';
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent || '');
    var warn = '';
    if (!notifySupported()) {
      warn = isIOS && !isStandalone()
        ? 'На iPhone уведомления работают только в приложении, добавленном на экран «Домой» '
          + '(«Поделиться» → «На экран Домой»), и на iOS 16.4 или новее. В Safari их не будет.'
        : 'Этот браузер не умеет уведомления.';
    } else if (Notification.permission === 'denied') {
      warn = 'Уведомления запрещены для этого сайта в настройках телефона — '
           + 'разрешите их там, иначе приложение не сможет ничего прислать.';
    } else if (isIOS && !isStandalone()) {
      warn = 'Сейчас страница открыта в браузере. На iPhone уведомления приходят только '
           + 'из приложения, добавленного на экран «Домой».';
    } else if (notifyOn) {
      warn = 'Уведомления приходят, пока приложение открыто или свёрнуто в фоне. '
           + 'Если закрыть его полностью, телефон перестанет проверять табло.';
    }
    notifyWarn.innerHTML = warn;

    renderEvents();

    // видимая диагностика: чтобы не гадать, что именно не сработало
    var d = [];
    d.push('разрешение: ' + (notifySupported() ? Notification.permission : 'не поддерживается'));
    d.push('режим: ' + (isStandalone() ? 'приложение' : 'браузер'));
    d.push('воркер: ' + (swReg ? 'готов' : ('serviceWorker' in navigator ? 'не запущен' : 'нет')));
    if (watch.length) d.push('слежу за: ' + watch.join(', '));
    if (lastNoteError) d.push('ошибка показа: ' + lastNoteError);
    notifyDiag.innerHTML = esc(d.join(' · '));
  }

  gear.addEventListener('click', function () {
    settings.classList.toggle('open');
  });

  function addWatch() {
    var v = inputEl.value.trim().replace(/\s+/g, ' ');
    if (!v) return;
    var dup = false;
    for (var i = 0; i < watch.length; i++) if (norm(watch[i]) === norm(v)) dup = true;
    if (!dup) { watch.push(v); save('tanay_watch', watch); }
    inputEl.value = '';
    renderChips();
    if (lastData) render(lastData);
  }
  document.getElementById('watchAdd').addEventListener('click', addWatch);
  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); addWatch(); }
  });
  chipsEl.addEventListener('click', function (e) {
    var i = e.target.getAttribute && e.target.getAttribute('data-del');
    if (i == null) return;
    watch.splice(parseInt(i, 10), 1);
    save('tanay_watch', watch);
    renderChips();
    if (lastData) render(lastData);
  });

  optNotify.addEventListener('change', function () {
    if (!optNotify.checked) {
      notifyOn = false; save('tanay_notify', notifyOn); renderNotifyState(); return;
    }
    if (!notifySupported()) { optNotify.checked = false; renderNotifyState(); return; }
    Notification.requestPermission().then(function (p) {
      notifyOn = (p === 'granted');
      save('tanay_notify', notifyOn);
      lastNoteError = '';
      renderNotifyState();
      if (notifyOn) {
        return ensureSw().then(function () {
          return showNote('Уведомления включены',
                          'Сообщу, когда ваша фамилия появится во взлёте.', 'test');
        }).then(renderNotifyState);
      }
    });
  });

  notifyTest.addEventListener('click', function () {
    lastNoteError = '';
    if (!notifySupported()) { renderNotifyState(); return; }
    if (Notification.permission !== 'granted') {
      Notification.requestPermission().then(function () { renderNotifyState(); });
      return;
    }
    showNote('Проверка', 'Если вы это видите — уведомления работают.',
             'test' + Date.now()).then(renderNotifyState);
  });

  // ---------- отрисовка табло ----------
  function fmtTitle(t) {
    var s = esc(t).replace(/(^|\s)готов(?=\s|$)/, '$1готовность');
    s = s.replace(/(ОТПРАВЛЕН!*)/, '<span class="sent">$1</span>');
    // готовность выносим в отдельную строку, поэтому пробел перед ней убираем
    s = s.replace(/\s*(готовность[^<]*)/, '<span class="ready">$1</span>');
    return s;
  }

  var lastData = null;

  function render(d) {
    lastData = d;
    clockEl.innerHTML = '<small>борт-время</small>' + esc(d.clock || '—');

    untilEl.innerHTML = d.work_until
      ? '<span class="until">' + esc(d.work_until) + '</span>' : '';

    var html = '';
    var loads = d.loads || [];

    if (d.status === 'no_board') {
      html += '<div class="stale">Табло сейчас не транслируется — на экране заставка подключения. Обычно это ненадолго.</div>';
    }
    if (d.updated) {
      var age = Date.now() - new Date(d.updated).getTime();
      if (age > MAX_AGE_MS) html += '<div class="stale">Данные не обновлялись более 10 минут</div>';
    }
    if (d.message) html += '<div class="msg">' + esc(d.message) + '</div>';

    if (!loads.length && d.status !== 'no_board') html += '<div class="note">Пока никого не записано.</div>';

    for (var i = 0; i < loads.length; i++) {
      var L = loads[i], rows = L.rows || [];
      var seats = L.free_from ? (L.free_from - 1) : rows.length;
      var denom = Math.max(seats, 18);
      var pct = Math.min(100, Math.round(rows.length / denom * 100));
      var closed = collapsed[i] ? ' closed' : '';
      var full = (!L.free_from && rows.length) ? ' full' : '';
      var hasMine = false;
      for (var m = 0; m < rows.length; m++) {
        if (!isService(rows[m]) && isWatched(rows[m].name)) { hasMine = true; break; }
      }
      html += '<div class="load' + closed + full + (hasMine ? ' mine' : '') + '" data-i="' + i + '">';
      html += '<h2><span class="t">' + fmtTitle(L.title || ('взлёт ' + (i+1))) + '</span>';
      html += '<span class="count">' + rows.length + (L.capacity ? ' / ' + L.capacity : '') + '</span></h2>';
      html += '<div class="fill"><i style="width:' + pct + '%"></i></div>';
      html += '<div class="body">';
      for (var j = 0; j < rows.length; j++) {
        var r = rows[j];
        var service = isService(r);
        var cls = 'row' + (r.staff ? ' staff' : '') + (service ? ' service' : '')
                + (!service && isWatched(r.name) ? ' me' : '');
        html += '<div class="' + cls + '"><span class="num">' + esc(r.n) + '</span>'
             +  '<span class="name">' + esc(r.name) + '</span>'
             +  '<span class="cat">' + esc(r.cat) + '</span></div>';
      }
      var free = (L.free != null) ? L.free
               : (L.free_from ? Math.max(0, 19 - L.free_from) : 0);
      if (free > 0) {
        html += '<span class="freechip">свободно ' + free + ' '
             +  plural(free, 'место', 'места', 'мест') + '</span>';
      }
      html += '</div></div>';
    }
    app.innerHTML = html;
  }

  // один обработчик на контейнер - переживает перерисовки
  app.addEventListener('click', function(e) {
    var h = e.target.closest ? e.target.closest('.load h2') : null;
    if (h) {
      var block = h.parentNode;
      var i = block.getAttribute('data-i');
      if (block.classList.toggle('closed')) collapsed[i] = 1;
      else delete collapsed[i];
      save('tanay_collapsed', collapsed);
    }
  });

  function fetchJson(url) {
    // метка ?app нужна только для счётчика: так видно, сколько людей
    // смотрят табло из приложения, а сколько из браузера
    var mark = isStandalone() ? '&app=1' : '';
    return fetch(url + '?t=' + Date.now() + mark, { cache: 'no-store' })
      .then(function(r){ return r.ok ? r.json() : Promise.reject(); });
  }

  function tick() {
    fetchJson(JSON_URL)
      .catch(function(){ return fetchJson(JSON_FALLBACK); })   // если воркер недоступен
      .then(function(d){ render(d); checkNotifications(d); })
      .catch(function(){
        if (lastData) return;
        app.innerHTML = '<div class="note">Текстовая версия ещё готовится — распознавание пока не запущено.<br><br>'
                      + 'Рабочее табло доступно по ссылке ниже.</div>';
      });
  }

  renderChips();
  renderNotifyState();
  // опрашиваем только когда приложение на экране: в фоне телефон всё равно
  // тормозит таймеры, а лишние запросы бьют по лимитам воркера
  function alive() {
    return !document.hidden;
  }
  tick();
  setInterval(function () { if (alive()) tick(); }, POLL_MS);
  document.addEventListener('visibilitychange', function () {
    if (alive()) tick();          // вернулись к приложению - сразу обновляем
  });

  // воркер нужен и для установки, и для уведомлений (он их показывает на Android)
  if ('serviceWorker' in navigator && (window.__TANAY_APP || notifyOn)) {
    navigator.serviceWorker.register('sw.js').then(function (reg) { swReg = reg; })
      .catch(function(){});
  }
</script>
</body>
</html>
