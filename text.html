<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Табло — текст</title>
<style>
  body { margin:0; background:#111; color:#eee; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:12px; }
  .top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; }
  .clock { font-size:17px; font-weight:500; }
  .until { font-size:14px; color:#EF9F27; }
  .load { background:#1c1c1c; border-radius:8px; padding:10px 12px; margin-bottom:10px; }
  .load h2 { margin:0 0 8px; font-size:16px; font-weight:500; color:#5DCAA5; display:flex; justify-content:space-between; align-items:baseline; }
  .count { font-size:12px; color:#888; font-weight:400; }
  .row { display:flex; gap:8px; padding:4px 0; border-bottom:1px solid #2a2a2a; font-size:14px; }
  .row:last-child { border-bottom:none; }
  .num { color:#5F5E5A; width:22px; flex:none; }
  .name { flex:1; }
  .cat { color:#85B7EB; flex:none; }
  .free { color:#97C459; }
  .note { color:#888; font-size:14px; line-height:1.6; padding:20px 4px; }
  a.switch { display:block; text-align:center; color:#666; font-size:13px; text-decoration:none; padding:14px; }
  a.switch:hover { color:#aaa; }
  .stale { background:#3a2a12; color:#EF9F27; border-radius:8px; padding:10px 12px; margin-bottom:10px; font-size:14px; }
</style>
</head>
<body>
<div id="app"><div class="note">Загрузка…</div></div>
<a class="switch" href="index.html">← вернуться к картинке</a>
<script>
  var JSON_URL   = "https://raw.githubusercontent.com/Sweatyeyes/Tanay-board/ocr/board.json";
  var MAX_AGE_MS = 10 * 60 * 1000;
  var app = document.getElementById('app');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }

  function render(d) {
    var html = '';
    html += '<div class="top"><span class="clock">' + esc(d.clock || '') + '</span>';
    if (d.work_until) html += '<span class="until">до ' + esc(d.work_until) + '</span>';
    html += '</div>';

    if (d.updated) {
      var age = Date.now() - new Date(d.updated).getTime();
      if (age > MAX_AGE_MS) html += '<div class="stale">Данные не обновлялись более 10 минут</div>';
    }

    var loads = d.loads || [];
    if (!loads.length) html += '<div class="note">Пока никого не записано.</div>';

    for (var i = 0; i < loads.length; i++) {
      var L = loads[i], rows = L.rows || [];
      html += '<div class="load"><h2>' + esc(L.title || ('взлёт ' + (i+1)));
      html += '<span class="count">' + rows.length + (L.capacity ? ' / ' + L.capacity : '') + '</span></h2>';
      for (var j = 0; j < rows.length; j++) {
        html += '<div class="row"><span class="num">' + esc(rows[j].n) + '</span>'
             +  '<span class="name">' + esc(rows[j].name) + '</span>'
             +  '<span class="cat">' + esc(rows[j].cat) + '</span></div>';
      }
      if (L.free_from) {
        html += '<div class="row"><span class="num free">' + esc(L.free_from) + '</span>'
             +  '<span class="name free">свободно</span></div>';
      }
      html += '</div>';
    }
    app.innerHTML = html;
  }

  function tick() {
    fetch(JSON_URL + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
      .then(render)
      .catch(function(){
        app.innerHTML = '<div class="note">Текстовая версия ещё готовится — распознавание пока не запущено.<br><br>'
                      + 'Рабочее табло доступно по ссылке ниже.</div>';
      });
  }

  tick();
  setInterval(tick, 20000);
</script>
</body>
</html>
